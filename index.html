<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RainPhil FSR">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; object-src 'none'; connect-src 'self' blob: data:; base-uri 'none'; form-action 'none'">
<meta name="fsr-build" content="1.2.2-m3-20261030075303">
<title>RainPhil FSR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* ===== Design tokens: iOS / iPadOS system palette, RainPhil blue as the app tint ===== */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-2:#F2F2F7; --elev:#FFFFFF;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(120,120,128,.2);
  --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --sep-opaque:#C6C6C8;
  --tint:#2346D8; --tint-soft:rgba(35,70,216,.12);
  --green:#34C759; --orange:#FF9500; --red:#FF3B30; --blue:#007AFF; --indigo:#5856D6; --purple:#AF52DE; --teal:#30B0C7; --gray:#8E8E93; --pink:#FF2D55; --brown:#A2845E;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.6);
  --shadow:0 8px 30px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 24px 70px rgba(0,0,0,.22);
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.25,.1,.25,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --c-await:#C26A00; --c-final:#1E8E3E; --c-sent:#0062CC; --c-void:#D70015; --c-net:#1E8E3E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000; --cell:#1C1C1E; --cell-2:#2C2C2E; --elev:#2C2C2E;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.36);
  --label:#fff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --sep-opaque:#38383A;
  --tint:#6680FF; --tint-soft:rgba(102,128,255,.2);
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --blue:#0A84FF; --indigo:#5E5CE6; --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F;
  --glass:rgba(30,30,32,.62); --glass-strong:rgba(40,40,44,.84); --glass-border:rgba(255,255,255,.08);
  --shadow:0 8px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 70px rgba(0,0,0,.7);
  --c-await:#FF9F0A; --c-final:#30D158; --c-sent:#0A84FF; --c-void:#FF453A; --c-net:#30D158;
}}
:root[data-theme="dark"]{
  --bg:#000; --cell:#1C1C1E; --cell-2:#2C2C2E; --elev:#2C2C2E;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.36);
  --label:#fff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --sep-opaque:#38383A;
  --tint:#6680FF; --tint-soft:rgba(102,128,255,.2);
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --blue:#0A84FF; --indigo:#5E5CE6; --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F;
  --glass:rgba(30,30,32,.62); --glass-strong:rgba(40,40,44,.84); --glass-border:rgba(255,255,255,.08);
  --shadow:0 8px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 70px rgba(0,0,0,.7);
  --c-await:#FF9F0A; --c-final:#30D158; --c-sent:#0A84FF; --c-void:#FF453A; --c-net:#30D158;
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important} }

/* ===== Base ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:17px;color:var(--label);letter-spacing:inherit}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:17px;height:17px} svg.i.xs{width:14px;height:14px;stroke-width:2.2} svg.i.lg{width:28px;height:28px} svg.i.xl{width:56px;height:56px;stroke-width:1.5}
h1,h2,h3{margin:0}
.large-title{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.title2{font-size:22px;font-weight:700;letter-spacing:.01em}
.title3{font-size:20px;font-weight:600}
.headline{font-size:17px;font-weight:600}
.sub{font-size:15px} .foot{font-size:13px} .cap{font-size:12px}
.l2{color:var(--label-2)} .l3{color:var(--label-3)} .tint{color:var(--tint)}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1} .wrap{flex-wrap:wrap} .hidden{display:none!important}

/* ===== Shell: iPadOS floating glass sidebar + content ===== */
.shell{display:grid;grid-template-columns:300px 1fr;height:100dvh}
.sidebar{margin:10px 0 10px 10px;border-radius:24px;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-border);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:18px 12px 12px;overflow:auto}
.sb-head{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.sb-head img{height:34px;width:34px;object-fit:cover;object-position:left;border-radius:50%;background:#fff}
.sb-title{font-size:28px;font-weight:700;letter-spacing:.01em;padding:0 8px 10px}
.side-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;width:100%;text-align:left;font-size:17px;color:var(--label);transition:background .2s}
.side-item svg.i{color:var(--tint)}
.side-item:hover{background:var(--fill)}
.side-item.active{background:var(--tint);color:#fff;font-weight:600}
.side-item.active svg.i{color:#fff}
.side-item .count{margin-left:auto;font-size:15px;color:var(--label-2)}
.side-item.active .count{color:rgba(255,255,255,.85)}
.sb-sec{font-size:13px;font-weight:600;color:var(--label-2);padding:16px 10px 6px;text-transform:uppercase;letter-spacing:.02em}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:0;background:var(--fill);cursor:pointer;text-align:left;width:100%}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;width:40px;height:40px;font-size:16px;background:linear-gradient(180deg,#A5ABB8,#858A96)}
.av-blue{background:linear-gradient(180deg,#5C7CFA,#2346D8)} .av-orange{background:linear-gradient(180deg,#FFB340,#F57C00)} .av-green{background:linear-gradient(180deg,#5EDC86,#22A447)} .av-purple{background:linear-gradient(180deg,#C77DFF,#8E3FD6)}

.main{display:flex;flex-direction:column;min-width:0;height:100dvh;position:relative}
.navbar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 20px;min-height:56px;transition:background .25s,border-color .25s;border-bottom:.5px solid transparent}
.navbar.scrolled{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom-color:var(--sep)}
.navbar .inline-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.navbar.scrolled .inline-title{opacity:1}
.content{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:56px 28px 40px}
.page{max-width:980px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.tabbar{display:none}

/* glass toolbar buttons */
.gbtn{height:40px;min-width:40px;padding:0 14px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:.5px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 2px 10px rgba(0,0,0,.08);color:var(--tint);font-size:17px;cursor:pointer;transition:transform .25s var(--spring)}
.gbtn:active{transform:scale(.9)}
.gbtn.icon{padding:0;width:40px}
.gbtn.prom{background:var(--tint);color:#fff;border-color:transparent;font-weight:600}
.netpill{height:30px;padding:0 12px;border-radius:99px;border:0;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(52,199,89,.15);color:var(--c-net);cursor:pointer}
.netpill.off{background:rgba(255,149,0,.16);color:var(--c-await)}
.netpill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.offline-note{display:none;margin:0 0 16px;padding:12px 16px;border-radius:14px;background:rgba(255,149,0,.12);font-size:15px;align-items:center;gap:10px}
.offline-note svg{color:var(--orange)}
body.offline .offline-note{display:flex}

@media (max-width:900px){
  .shell{grid-template-columns:1fr} .sidebar{display:none}
  .content{padding:56px 16px 120px}
  .navbar{padding:8px 12px}
  .tabbar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;padding:6px;gap:2px;border-radius:99px;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-border);box-shadow:var(--shadow-lg)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;color:var(--label);padding:6px 14px;border-radius:99px;cursor:pointer;min-width:62px}
  .tabbar button.active{color:var(--tint);background:var(--fill)}
  .large-title{font-size:30px;line-height:36px}
}

/* ===== Inset grouped lists ===== */
.sec-h{font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px;display:flex;align-items:center;gap:6px}
.sec-f{font-size:13px;color:var(--label-2);padding:7px 16px 0;line-height:1.4}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.gsec{margin-bottom:30px;scroll-margin-top:200px}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;background:var(--cell);width:100%;border:0;text-align:left;cursor:default}
button.cell,.cell.tap{cursor:pointer;transition:background .15s}
button.cell:active,.cell.tap:active{background:var(--fill-3)}
.cell+.cell::before,.cell+.swipe::before,.swipe+.cell::before,.swipe+.swipe::before,.cell+.assist::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep);z-index:2}
.cell.ic-row,.swipe{--inset:60px}
.cell .lbl{flex:none;min-width:130px}
.cell .val{flex:1;text-align:right;color:var(--label-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell input.val{border:0;outline:0;background:transparent;color:var(--label);text-align:right}
.cell input::placeholder,.cell textarea::placeholder{color:var(--label-3)}
.cell .chev{color:var(--label-3);display:flex}
.cell textarea.full{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:96px;line-height:1.4;padding:4px 0}
.cell input.full{flex:1;border:0;outline:0;background:transparent;min-width:0}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.sq svg.i{width:19px;height:19px;stroke-width:2}
.cell .t{flex:1;min-width:0;display:flex;flex-direction:column}
.cell .t b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t span{font-size:15px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t b.strong{font-weight:600}
.addrow{color:var(--tint)}
.add-dot{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.del-dot{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;border:0;cursor:pointer;font-weight:700;line-height:1;padding:0}
.checkmark{color:var(--tint);visibility:hidden;display:flex}
.on>.checkmark{visibility:visible}
.radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label-3);display:grid;place-items:center;flex:none;color:transparent;transition:all .25s var(--spring)}
.radio.on{background:var(--tint);border-color:var(--tint);color:#fff;transform:scale(1.05)}

/* status capsule */
.cap-s{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.cap-s i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-draft{background:var(--fill);color:var(--label-2)}
.st-await{background:rgba(255,149,0,.15);color:var(--c-await)}
.st-final{background:rgba(52,199,89,.15);color:var(--c-final)}
.st-sent{background:rgba(0,122,255,.13);color:var(--c-sent)}
.st-void{background:rgba(255,59,48,.13);color:var(--c-void)}
.badge-src{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label-2);text-transform:none;letter-spacing:0}
.badge-src.m{background:var(--tint-soft);color:var(--tint)}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:0;font-size:17px;font-weight:600;cursor:pointer;transition:transform .25s var(--spring),opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.filled{background:var(--tint);color:#fff}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.gray{background:var(--fill-2);color:var(--label)}
.btn.plain{background:transparent;color:var(--tint);font-weight:400;padding:0 8px;min-height:44px}
.btn.destructive{background:rgba(255,59,48,.12);color:var(--red)}
.btn.capsule{border-radius:99px}
.btn.small{min-height:34px;padding:0 14px;font-size:15px;border-radius:99px}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.switch{position:relative;width:51px;height:31px;border-radius:99px;background:var(--fill-3);border:0;cursor:pointer;flex:none;transition:background .3s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .35s var(--spring)}
.switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}
.segmented{position:relative;display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.segmented button{position:relative;z-index:1;border:0;background:none;padding:0 14px;height:30px;font-size:14px;font-weight:500;border-radius:7px;cursor:pointer;white-space:nowrap;flex:1}
.segmented button.on{font-weight:600}
.segmented .thumb{position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:left .35s var(--spring),width .35s var(--spring)}
:root[data-theme="dark"] .segmented .thumb{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .segmented .thumb{background:#636366}}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;overflow:hidden}
.stepper button{width:46px;height:32px;border:0;background:none;font-size:20px;cursor:pointer}
.stepper button:active{background:var(--fill-3)}
.stepper b{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);line-height:20px}
.search{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:11px;background:var(--fill);color:var(--label-2);flex:1}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.scope{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}
.scope::-webkit-scrollbar{display:none}
.scope button{height:34px;padding:0 14px;border-radius:99px;border:0;background:var(--cell);font-size:15px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 0 .5px var(--sep);transition:background .2s}
.scope button.on{background:var(--tint);color:#fff;box-shadow:none;font-weight:600}
.scope button.done svg{color:var(--green)} .scope button.miss svg{color:var(--orange)}
.scope button.on svg{color:#fff!important}

/* pull-down menu */
.menu-pop{position:fixed;z-index:90;min-width:250px;border-radius:14px;background:var(--glass-strong);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow-lg);border:.5px solid var(--glass-border);overflow:hidden;transform-origin:top right;animation:menuIn .3s var(--spring)}
@keyframes menuIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 16px 0 10px;border:0;background:none;text-align:left;cursor:pointer;font-size:17px}
.menu-pop button+button{border-top:.5px solid var(--sep)}
.menu-pop button:hover{background:var(--fill)}
.menu-pop .ck{width:20px;display:flex}
.menu-pop .destr{color:var(--red)}

/* ===== Banners, alerts, sheets, HUD ===== */
.banners{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.banner{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-lg);border:.5px solid var(--glass-border);font-size:15px;font-weight:500;animation:bannerIn .5s var(--spring);pointer-events:auto;max-width:92vw}
.banner .bi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tint);flex:none}
.banner .bi svg{width:17px;height:17px;stroke-width:2.2}
.banner.out{animation:bannerOut .35s var(--ease) forwards}
.banner button{border:0;background:none;color:var(--tint);font-weight:600;cursor:pointer;padding-left:6px}
@keyframes bannerIn{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bannerOut{to{opacity:0;transform:translateY(-20px) scale(.95)}}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.28);animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alert{position:fixed;left:50%;top:50%;z-index:85;width:290px;transform:translate(-50%,-50%);border-radius:16px;background:var(--glass-strong);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);text-align:center;overflow:hidden;animation:alertIn .35s var(--spring);box-shadow:var(--shadow-lg)}
@keyframes alertIn{from{opacity:0;transform:translate(-50%,-50%) scale(1.15)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.alert .ab{padding:20px 16px 16px}
.alert h3{font-size:17px;font-weight:600;margin-bottom:4px}
.alert p{margin:0;font-size:13px;line-height:1.35}
.alert .acts{display:flex;border-top:.5px solid var(--sep)}
.alert .acts button{flex:1;height:44px;border:0;background:none;color:var(--tint);font-size:17px;cursor:pointer}
.alert .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.alert .acts button.destr{color:var(--red)}
.sheet{position:fixed;z-index:85;left:50%;bottom:0;width:min(700px,100vw);height:min(92dvh,900px);transform:translateX(-50%);background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:sheetIn .5s var(--spring);overflow:hidden}

.cell input[type=date],.cell select{border:0;background:transparent;color:var(--tint);font:inherit;text-align:right}

/* Shared helpers: DOM, escaping, icons, banners, alerts, sheets, menus, segmented controls. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (id, cls = '') => `<svg class="i ${cls}"><use href="#${id}"/></svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2);
const now = () => new Date().toISOString();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const initials = name => String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const AVATARS = ['av-blue', 'av-orange', 'av-green', 'av-purple'];
const avatarClass = key => AVATARS[[...String(key)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATARS.length];

// Dates print in Asia/Manila, dd/mm/yyyy, 12-hour time
const TZ = 'Asia/Manila';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }) : '';
const fmtDateTime = iso => iso ? `${fmtDate(iso)} · ${fmtTime(iso)}` : '';
const yearOf = iso => new Date(iso || Date.now()).toLocaleDateString('en-GB', { timeZone: TZ, year: 'numeric' });

/* ---- db.js ---- */
/* IndexedDB storage. Bump DB_VERSION and add a step in upgrade() when the schema changes. */
const DB_NAME = 'rainphil-fsr';
const DB_VERSION = 1;
let _db;

function upgrade(db, oldVersion) {
  if (oldVersion < 1) {
    db.createObjectStore('profiles', { keyPath: 'username' });
    const r = db.createObjectStore('reports', { keyPath: 'id' });
    r.createIndex('profile', 'profile');
    r.createIndex('fsrNo', 'fsrNo', { unique: true });
    db.createObjectStore('photos', { keyPath: 'id' }).createIndex('reportId', 'reportId');
    db.createObjectStore('customers', { keyPath: 'id' });
    db.createObjectStore('contacts', { keyPath: 'id' }).createIndex('customerId', 'customerId');
    db.createObjectStore('instruments', { keyPath: 'id' }).createIndex('customerId', 'customerId');
    db.createObjectStore('meta', { keyPath: 'key' });
  }
}

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const q = indexedDB.open(DB_NAME, DB_VERSION);
    q.onupgradeneeded = e => upgrade(q.result, e.oldVersion);
    q.onsuccess = () => { _db = q.result; res(_db); };
    q.onerror = () => rej(q.error);
  });
}
const reqP = q => new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
async function tx(stores, mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(stores, mode);
    let out;
    Promise.resolve(fn(...[].concat(stores).map(s => t.objectStore(s)))).then(v => out = v, rej);
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Transaction aborted'));
  });
}
const DB = {
  get: (store, key) => tx(store, 'readonly', s => reqP(s.get(key))),
  all: (store) => tx(store, 'readonly', s => reqP(s.getAll())),
  byIndex: (store, index, value) => tx(store, 'readonly', s => reqP(s.index(index).getAll(value))),
  put: (store, value) => tx(store, 'readwrite', s => reqP(s.put(value))),
  del: (store, key) => tx(store, 'readwrite', s => reqP(s.delete(key))),
  meta: async (key, fallback) => (await DB.get('meta', key))?.value ?? fallback,
  setMeta: (key, value) => DB.put('meta', { key, value }),
};

// Strip fields IndexedDB can't index (null fsrNo must be absent, not null, for the unique index)
function cleanReport(r) {
  const c = { ...r };
  if (c.fsrNo == null) delete c.fsrNo;
  return c;
}

/* ---- fsrkey.js ---- */
/* FSR number-block keys: shared by the app (verify) and the FSR Block Generator (sign).
   Same scheme as the Quotation Maker licences: ECDSA P-256 signature, Crockford base32, 6-char groups.
   Bytes: [format=1, generation, blockId u16, start u32, count u16, issued days-since-2020 u16, sig r||s 64] = 76 bytes */
const FSK = {
  PREFIX: 'FSK1', CODE: 'FSR', GEN: 1, LEN: 76,
  A32: '0123456789ABCDEFGHJKMNPQRSTVWXYZ', DAY0: Date.UTC(2020, 0, 1),
  norm: u => String(u || '').trim().replace(/\s+/g, ' ').toLowerCase(),
  b32(bytes) {
    let bits = 0, val = 0, out = '';
    for (const b of bytes) { val = ((val << 8) | b) & 0xffffff; bits += 8; while (bits >= 5) { out += FSK.A32[(val >>> (bits - 5)) & 31]; bits -= 5; } }
    if (bits > 0) out += FSK.A32[(val << (5 - bits)) & 31];
    return out;
  },
  b32dec(str) {
    const s = String(str).toUpperCase().replace(/[IL]/g, '1').replace(/O/g, '0').replace(/[^0-9A-Z]/g, '');
    let bits = 0, val = 0; const out = [];
    for (const ch of s) { const v = FSK.A32.indexOf(ch); if (v < 0) return null; val = ((val << 5) | v) & 0xffffff; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
    return new Uint8Array(out);
  },
  b64: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  dayOf: iso => Math.round((Date.parse(iso + 'T00:00:00Z') - FSK.DAY0) / 864e5),
  isoOf: d => new Date(FSK.DAY0 + d * 864e5).toISOString().slice(0, 10),
  message: (f, user) => new TextEncoder().encode(`${FSK.CODE}|G${f.gen}|${f.blockId}|${f.start}|${f.count}|${FSK.norm(user)}|${f.issued}`),
  pack(f, sig) {
    const b = new Uint8Array(FSK.LEN), d = FSK.dayOf(f.issued);
    b[0] = 1; b[1] = f.gen; b[2] = f.blockId >> 8; b[3] = f.blockId & 255;
    b[4] = (f.start >>> 24) & 255; b[5] = (f.start >>> 16) & 255; b[6] = (f.start >>> 8) & 255; b[7] = f.start & 255;
    b[8] = f.count >> 8; b[9] = f.count & 255; b[10] = d >> 8; b[11] = d & 255; b.set(sig, 12);
    return FSK.PREFIX + '-' + FSK.b32(b).match(/.{1,6}/g).join('-');
  },
  // Returns the fields, or null when the text isn't a well-formed FSR key
  unpack(key) {
    const k = String(key || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!k.startsWith(FSK.PREFIX)) return null;
    const b = FSK.b32dec(k.slice(FSK.PREFIX.length));
    if (!b || b.length < FSK.LEN || b[0] !== 1) return null;
    return {
      gen: b[1], blockId: (b[2] << 8) | b[3], start: ((b[4] << 24) >>> 0) + (b[5] << 16) + (b[6] << 8) + b[7],
      count: (b[8] << 8) | b[9], issued: FSK.isoOf((b[10] << 8) | b[11]), sig: b.slice(12, FSK.LEN),
    };
  },
  async importPublic(spkiB64) { return crypto.subtle.importKey('spki', FSK.b64(spkiB64), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']); },
  async verify(pub, f, user) { return crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pub, f.sig, FSK.message(f, user)); },
  async sign(priv, f, user) { return new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, priv, FSK.message(f, user))); },
  link: (appUrl, key, user) => `${appUrl.replace(/#.*$/, '').replace(/\/?$/, '/')}#activate=${encodeURIComponent(key)}&u=${encodeURIComponent(user)}`,
};

/* ---- license.js ---- */
/* FSR number blocks: verify keys offline, queue blocks per engineer, hand out numbers, activation links.
   FSR_PUB / FSR_REVOKED / IS_TEST are stamped by build.py. */
const BLOCK_CONTACT = 'jonald@rainphil.com';
const LOW_LEFT = 10;
let _pub;
const fsrPublicKey = async () => _pub ??= await FSK.importPublic(FSR_PUB);

// → { ok: true, block } or { ok: false, why: 'format' | 'user' | 'revoked' }
async function verifyBlockKey(key, username) {
  const f = FSK.unpack(key);
  if (!f || f.gen !== FSK.GEN) return { ok: false, why: 'format' };
  if (!(await FSK.verify(await fsrPublicKey(), f, username))) return { ok: false, why: 'user' };
  if (FSR_REVOKED.includes(f.blockId)) return { ok: false, why: 'revoked', block: f };
  return { ok: true, block: { blockId: f.blockId, start: f.start, count: f.count, issued: f.issued, key: String(key).trim().toUpperCase().replace(/\s+/g, '') } };
}
const keyError = (r, username) => ({
  format: "That doesn't look like an FSR number key. It starts with FSK1-.",
  user: `This key wasn't issued to “${username}”. Check the username – it must match the one on the key.`,
  revoked: `Block ${r.block?.blockId} has been withdrawn. Ask ${BLOCK_CONTACT} for a new one.`,
})[r.why];

const rangeText = b => `${b.start}–${b.start + b.count - 1}`;
const usableBlocks = p => (p.blocks || []).filter(b => !FSR_REVOKED.includes(b.blockId)).sort((a, b) => a.start - b.start);
function blockState(p) {
  const blocks = usableBlocks(p);
  const open = blocks.filter(b => b.next < b.start + b.count);
  const left = open.reduce((n, b) => n + b.start + b.count - b.next, 0);
  return { active: open[0] || null, queued: open.slice(1), left, used: blocks.filter(b => b.next >= b.start + b.count), nextNo: open[0]?.next ?? null };
}
// lastUsed: the last number already used from this block elsewhere (re-entered key), or null for a fresh block
function addBlockTo(p, block, lastUsed) {
  p.blocks ??= [];
  if (p.blocks.some(b => b.blockId === block.blockId)) return { ok: false, msg: `Block ${rangeText(block)} is already on this iPad.` };
  const next = lastUsed ? Math.min(Math.max(lastUsed + 1, block.start), block.start + block.count) : block.start;
  p.blocks.push({ ...block, next, addedAt: now() });
  return { ok: true };
}

// Takes the next number and saves the report in one transaction (unique index on fsrNo guards duplicates)
async function assignNumber(r) {
  if (r.fsrNo) return r.fsrNo;
  let taken;
  await tx(['profiles', 'reports'], 'readwrite', async (ps, rs) => {
    const p = await reqP(ps.get(r.profile));
    const b = blockState(p).active;
    if (!b) throw new Error('NO_NUMBERS');
    // skip any number already used on this iPad (e.g. restored from a backup)
    while (b.next < b.start + b.count && await reqP(rs.index('fsrNo').count(String(b.next)))) b.next++;
    if (b.next >= b.start + b.count) throw new Error('NO_NUMBERS');
    taken = String(b.next); b.next += 1;
    r.fsrNo = taken;
    ps.put(p); rs.put(cleanReport(r));
    App.user.blocks = p.blocks;
  });
  audit(r, `FSR # ${r.fsrNo} assigned`);
  const left = blockState(App.user).left;
  if (left <= LOW_LEFT) setTimeout(() => banner(left ? `Only ${left} FSR number${left === 1 ? '' : 's'} left – request your next block` : 'That was your last FSR number – request a new block', 'hash', { label: 'Request', fn: requestBlock }, 'var(--orange)'), 1500);
  return r.fsrNo;
}

  ]);

// The link is kept in sessionStorage until it has been used, so a reload can't lose it
function readActivation() {
  const m = location.hash.match(/activate=([^&]+)/);
  if (m) {
    const u = location.hash.match(/[&#]u=([^&]+)/);
    history.replaceState(null, '', location.pathname + location.search);
    const act = { key: decodeURIComponent(m[1]), user: u ? decodeURIComponent(u[1]) : '' };
    try { sessionStorage.setItem('fsr.activation', JSON.stringify(act)); } catch { }
    return act;
  }
  try { return JSON.parse(sessionStorage.getItem('fsr.activation') || 'null'); } catch { return null; }
}
const activationUsed = () => { try { sessionStorage.removeItem('fsr.activation'); } catch { } };
// Called after unlock / boot when an activation link was opened
async function handleActivation(act) {
  if (!act) return;
  const profiles = await DB.all('profiles');
  const owner = profiles.find(p => FSK.norm(p.username) === FSK.norm(act.user));
  if (!owner) return onboarding(0, act);
  if (!App.user) { App.pendingActivation = act; return; }
  activationUsed();
  if (FSK.norm(App.user.username) !== FSK.norm(act.user)) return alertBox('Activation Link', `This link is for ${owner.name}. Switch to their profile to add it.`, [{ label: 'OK' }]);
  addBlockSheet(act.key);
}

function blockRing(s, size = 54) {
  const total = (s.active ? s.active.count : 1), left = s.active ? s.active.start + s.active.count - s.active.next : 0;

}

/* Engineer profiles, passcode hashing, lock screen, first-time setup, auto-lock. */
const DEFAULT_SETTINGS = {
  autoLockMin: 15, theme: 'auto', askLicense: true, reuseSignature: true,
  statement: 'I confirm the services above were performed and the instrument status is as stated.',
};
const App = { user: null };
const PBKDF2_ITER = 150000;
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const fromHex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

async function hashPin(pin, saltHex) {
  const salt = saltHex ? fromHex(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ITER }, key, 256);
  return { salt: toHex(salt), hash: toHex(bits) };
}

// Wrong-PIN back-off: 5 tries free, then 30 s, 1 min, 5 min, 15 min
const LOCKOUT = [30, 60, 300, 900];
async function checkPin(profile, pin) {
  if (profile.lockUntil && Date.now() < profile.lockUntil) return { ok: false, wait: Math.ceil((profile.lockUntil - Date.now()) / 1000) };
  const { hash } = await hashPin(pin, profile.pinSalt);
  if (hash === profile.pinHash) {
    if (profile.fails) { profile.fails = 0; profile.lockUntil = 0; await DB.put('profiles', profile); }
    return { ok: true };
  }
  profile.fails = (profile.fails || 0) + 1;
  if (profile.fails >= 5) profile.lockUntil = Date.now() + LOCKOUT[Math.min(profile.fails - 5, LOCKOUT.length - 1)] * 1000;
  await DB.put('profiles', profile);
  return { ok: false, left: Math.max(0, 5 - profile.fails), wait: profile.lockUntil > Date.now() ? Math.ceil((profile.lockUntil - Date.now()) / 1000) : 0 };
}
const settingsOf = p => ({ ...DEFAULT_SETTINGS, ...(p?.settings || {}) });

/* ---------- keypad (shared by lock screen, PIN prompts, setup) ---------- */
const KEYS = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ']];
function keypad(root, len, onDone) {
  let pin = '';
  root.innerHTML = `<div class="dots">${'<i></i>'.repeat(len)}</div><div class="keys">${KEYS.map(k => `<button data-k="${k[0]}"><b>${k[0]}</b><small>${k[1]}</small></button>`).join('')}<span></span><button data-k="0"><b>0</b><small></small></button><button data-k="del" class="kdel" aria-label="Delete">⌫</button></div>`;
  const dots = $('.dots', root);
  const paint = () => $$('i', dots).forEach((d, i) => d.classList.toggle('f', i < pin.length));
  const api = {
    reset() { pin = ''; paint(); },
    shake() { dots.classList.add('shake'); setTimeout(() => { dots.classList.remove('shake'); api.reset(); }, 450); },
  };
  const press = k => {
    if (k === 'del') pin = pin.slice(0, -1); else if (pin.length < len) pin += k;
    paint();
    if (pin.length === len) setTimeout(() => onDone(pin, api), 120);
  };
  $$('.keys button', root).forEach(b => b.onclick = () => press(b.dataset.k));
  root._keyHandler = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
  document.addEventListener('keydown', root._keyHandler);
  return api;
}
function detachKeypads() { $$('[data-keypad]').forEach(r => r._keyHandler && document.removeEventListener('keydown', r._keyHandler)); }

      Object.assign(draftProfile, { username, key: $('#ob-key').value.trim(), block: r.block, usedLast: usedBeforeValue(root) });
      onboarding(2);
    };
  } else if (step === 2) {
    $('#obnext').onclick = () => {
      const name = $('#ob-name').value.trim();
      if (!name) return banner('Enter your full name', 'person', null, 'var(--orange)');
      Object.assign(draftProfile, { name, designation: $('#ob-des').value.trim(), mobile: $('#ob-mob').value.trim(), email: $('#ob-mail').value.trim() });
      onboarding(3);
    };
  } else if (step === 3) {
    const len = draftProfile.pinLen || 4;
    $$('#ob-len button').forEach(b => b.addEventListener('click', () => { draftProfile.pinLen = +b.dataset.l; onboarding(3); }));
    keypad($('#obpad'), len, (pin, pad) => {
      if (!draftProfile.pin1) { draftProfile.pin1 = pin; draftProfile.pinLen = len; return onboarding(3); }
      if (pin !== draftProfile.pin1) { pad.shake(); $('#obmsg').textContent = "Passcodes didn't match – try again"; delete draftProfile.pin1; setTimeout(() => onboarding(3), 900); return; }
      draftProfile.pin = pin; delete draftProfile.pin1; onboarding(4);
    });
  } else if (step === last) {
    pads.ob = new SigPad($('#obsig'));
    $('#obnext').onclick = finishOnboarding;
  } else {
    $('#obnext').onclick = () => onboarding(step + 1);
  }
}
async function finishOnboarding() {
  const d = draftProfile;
  const { salt, hash } = await hashPin(d.pin);
  const p = {
    username: d.username, name: d.name, designation: d.designation, mobile: d.mobile, email: d.email,
    pinSalt: salt, pinHash: hash, pinLen: d.pinLen || 4, signature: pads.ob.len() > 60 ? pads.ob.toDataURL() : null,
    blocks: [], settings: {}, createdAt: now(),
  };
  addBlockTo(p, d.block, d.usedLast);
  activationUsed();
  await DB.put('profiles', p);

  App.user = p;
  await DB.setMeta('lastUser', p.username);
  $('#lockLayer').innerHTML = '';
  renderChrome(); go('home'); touch();
  banner(`Welcome, ${p.name.split(' ')[0]} – FSR # ${rangeText(p.blocks[0])} ready`, 'check', null, 'var(--green)');
}

}
const hoursOf = e => {
  const [sh, sm] = (e.start || '').split(':').map(Number), [eh, em] = (e.end || '').split(':').map(Number);
  if ([sh, sm, eh, em].some(isNaN)) return '';
  let h = (eh * 60 + em - sh * 60 - sm) / 60; if (h < 0) h += 24;
  return h.toFixed(1);
};
const visitDates = s => {
  if (!s.from) return '';
  const f = new Date(s.from + 'T00:00:00'), t = new Date((s.to || s.from) + 'T00:00:00');
  const d = x => x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  if (s.to && s.to !== s.from) return f.getMonth() === t.getMonth() && f.getFullYear() === t.getFullYear() ? `${f.getDate()}–${d(t)}` : `${d(f)} – ${d(t)}`;
  return d(f);
};
const reportTitle = r => `${r.fsrNo ? 'FSR # ' + r.fsrNo : 'Draft'} · ${r.customer.name || 'No customer yet'}`;
const reportSub = r => [r.problem.split('\n')[0], [r.instrument.model, r.instrument.serial].filter(Boolean).join(' · ')].filter(Boolean).join(' · ') || 'Empty draft';

// Which sections are complete, and what blocks signing
function sectionState(r) {
  return {
    cust: !!(r.customer.name && r.contact.name),
    inst: !!(r.instrument.model && r.instrument.serial),
    svc: !!(r.service.type && r.problem.trim()),
    find: r.findings.some(f => f.text.trim()),
    parts: true,
    status: !!r.outcome,
    photos: true,
    int: true,
  };
}
function missingItems(r) {
  const m = [];
  if (!r.customer.name) m.push(['cust', 'Customer name']);
  if (!r.contact.name) m.push(['cust', 'Contact person']);
  if (!r.instrument.model || !r.instrument.serial) m.push(['inst', 'Instrument model and serial #']);
  if (!r.service.type) m.push(['svc', 'Type of service']);
  if (!r.problem.trim()) m.push(['svc', 'Problem / request']);
  if (!r.findings.some(f => f.text.trim())) m.push(['find', 'At least one finding']);
  if (!r.outcome) m.push(['status', 'Status after visit']);
  return m;
}

function reviseReport() {
  confirmBox('Revise Report?', `This creates Rev ${R.rev + 1}. Signatures are cleared and the report must be signed again. The FSR # stays the same.`, 'Revise', async () => {
    R.rev += 1; R.status = 'draft'; R.revisedFrom = R.signedAt;

/* ---------- "Save to Contacts?" before signing ---------- */
const CUST_KEYS = ['name', 'short', 'address'];
const CONT_MAP = [['name', 'name'], ['designation', 'designation'], ['phone', 'mobile'], ['email', 'email']];
const INST_KEYS = ['type', 'brand', 'model', 'system', 'serial', 'software'];
async function contactChanges(r) {
  const out = [];
  if (!r.customer.name) return out;
  const cust = r.customer.id && await DB.get('customers', r.customer.id);
  if (!cust) out.push('new customer');
  else if (CUST_KEYS.some(k => (cust[k] || '') !== (r.customer[k] || ''))) out.push('customer details');
  if (r.contact.name) {
    const k = r.contact.id && await DB.get('contacts', r.contact.id);
    if (!k) out.push('new contact');
    else if (CONT_MAP.some(([a, b]) => (k[b] || '') !== (r.contact[a] || ''))) out.push('contact details');
  }
  if (r.instrument.serial || r.instrument.model) {
    const i = r.instrument.id && await DB.get('instruments', r.instrument.id);
    if (!i) out.push('new instrument');
    else if (INST_KEYS.some(k => (i[k] || '') !== (r.instrument[k] || '')) || JSON.stringify(i.modules || []) !== JSON.stringify(r.modules)) out.push('instrument details');
  }
  return out;
}
function askSaveToContacts(r) {
  return new Promise(async resolve => {
    const changes = await contactChanges(r);
    if (!changes.length) return resolve();
    const list = changes.join(', ').replace(/, ([^,]*)$/, ' and $1');
    alertBox('Save to Contacts?', `This report has ${list}. Save so you don't have to type them again?`, [
      { label: 'Not Now', fn: resolve },
      { label: 'Save', fn: async () => { await saveReportToContacts(r); banner('Saved to Contacts', 'users'); resolve(); } },
    ]);
  });
}
async function saveReportToContacts(r) {
  const cust = (r.customer.id && await DB.get('customers', r.customer.id)) || { id: uuid(), source: 'local', createdAt: now() };
  CUST_KEYS.forEach(k => cust[k] = r.customer[k] || '');
  await DB.put('customers', cust);
  r.customer.id = cust.id;
  if (r.contact.name) {
    const existing = await contactsOf(cust.id);
    const k = (r.contact.id && await DB.get('contacts', r.contact.id)) || { id: uuid(), customerId: cust.id, source: 'local', signatory: !existing.length };
    CONT_MAP.forEach(([a, b]) => k[b] = r.contact[a] || '');
    if (r.contact.license) k.license = r.contact.license;
    await DB.put('contacts', k);
    r.contact.id = k.id;
  }
  if (r.instrument.serial || r.instrument.model) {
    const i = (r.instrument.id && await DB.get('instruments', r.instrument.id)) || { id: uuid(), customerId: cust.id, source: 'local' };
    INST_KEYS.forEach(k => i[k] = r.instrument[k] || '');
    i.modules = r.modules.map(m => ({ ...m }));
    await DB.put('instruments', i);
    r.instrument.id = i.id;
  }
  await saveReport(r);
}

/* Signature pad and the guided signing flow (engineers → hand-over → customer → finalize). */
const pads = {};
class SigPad {
  constructor(wrap, onChange) {
    this.wrap = wrap; this.c = wrap.querySelector('canvas'); this.ctx = this.c.getContext('2d');
    this.strokes = []; this.onChange = onChange || (() => {}); this.pen = false;
    this.resize(); new ResizeObserver(() => this.resize()).observe(wrap);
    this.c.addEventListener('pointerdown', e => this.down(e));
    this.c.addEventListener('pointermove', e => this.move(e));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => this.c.addEventListener(t, () => this.up()));
  }
  resize() { const r = this.wrap.getBoundingClientRect(), d = devicePixelRatio || 1; this.w = r.width; this.h = r.height; this.c.width = r.width * d; this.c.height = r.height * d; this.ctx.setTransform(d, 0, 0, d, 0, 0); this.redraw(); }
  pt(e) { const r = this.c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' && e.pressure ? e.pressure : .5 }; }
  // Palm rejection: once an Apple Pencil is used, finger touches are ignored
  down(e) { if (e.pointerType === 'pen') this.pen = true; if (this.pen && e.pointerType === 'touch') return; this.c.setPointerCapture(e.pointerId); this.cur = [this.pt(e)]; this.strokes.push(this.cur); }
  move(e) { if (!this.cur) return; (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ev => this.cur.push(this.pt(ev))); this.draw(this.ctx, this.cur, true); }
  up() { if (!this.cur) return; this.cur = null; this.wrap.classList.toggle('has', this.len() > 0); this.onChange(this.len()); }
  len() { let L = 0; this.strokes.forEach(s => { for (let i = 1; i < s.length; i++) L += Math.hypot(s[i].x - s[i - 1].x, s[i].y - s[i - 1].y); }); return L; }
  draw(c, s, last, k = 1) {
    c.strokeStyle = '#14206B'; c.lineCap = c.lineJoin = 'round';
    if (s.length === 1) { c.beginPath(); c.arc(s[0].x * k, s[0].y * k, 1.5 * k, 0, 7); c.fillStyle = '#14206B'; c.fill(); return; }
    for (let i = last ? Math.max(1, s.length - 4) : 1; i < s.length; i++) {
      const a = s[i - 2] || s[i - 1], b = s[i - 1], d = s[i];
      c.lineWidth = Math.max(1.1, 1.4 + d.p * 2.6 - Math.min(Math.hypot(d.x - b.x, d.y - b.y), 30) * .04) * k;
      c.beginPath(); c.moveTo((a.x + b.x) / 2 * k, (a.y + b.y) / 2 * k); c.quadraticCurveTo(b.x * k, b.y * k, (b.x + d.x) / 2 * k, (b.y + d.y) / 2 * k); c.stroke();
    }
  }
  redraw() { if (!this.w) return; this.ctx.clearRect(0, 0, this.w, this.h); this.strokes.forEach(s => this.draw(this.ctx, s)); }
  clear() { this.strokes = []; this.redraw(); this.wrap.classList.remove('has'); this.onChange(0); }
  undo() { this.strokes.pop(); this.redraw(); this.wrap.classList.toggle('has', this.len() > 0); this.onChange(this.len()); }
  // Transparent PNG cropped to the ink, at 2x for print quality
  toDataURL() {
    const pts = this.strokes.flat(); if (!pts.length) return null;
    const pad = 8, k = 2;
    const x0 = Math.max(0, Math.min(...pts.map(p => p.x)) - pad), y0 = Math.max(0, Math.min(...pts.map(p => p.y)) - pad);
    const x1 = Math.max(...pts.map(p => p.x)) + pad, y1 = Math.max(...pts.map(p => p.y)) + pad;
    const c = document.createElement('canvas'); c.width = (x1 - x0) * k; c.height = (y1 - y0) * k;
    const ctx = c.getContext('2d');
    this.strokes.forEach(s => this.draw(ctx, s.map(p => ({ ...p, x: p.x - x0, y: p.y - y0 })), false, k));
    return c.toDataURL('image/png');
  }
}
const padHTML = (id, hint, h = 190) => `<div class="sigpad" id="${id}" style="height:${h}px"><canvas></canvas><div class="guide"></div><span class="x">✕</span><div class="hint">${esc(hint)}</div><div class="tools"><button data-u>Undo</button><button data-c>Clear</button></div></div>`;

}

// Everything the customer signs for – internal notes, audit and photos excluded
function clientContent(r) {
  const { fsrNo, rev, customer, contact, instrument, modules, service, problem, findings, parts, engineers, outcome, recommendation, nextVisit } = r;
  return JSON.stringify({ fsrNo, rev, customer, contact, instrument, modules, service, problem, findings, parts, outcome, recommendation, nextVisit, engineers: engineers.map(e => ({ name: e.name, designation: e.designation, start: e.start, end: e.end, travel: e.travel })) });
}

// Numbers come from the engineer's blocks (license.js). Returns false when none are left.

    body.innerHTML = `<div class="stamp-wrap"><div class="stamp"><span style="font-size:13px;font-weight:700;letter-spacing:.2em">FINAL · SIGNED</span><b>FSR # ${esc(R.fsrNo)}</b><span class="foot">${esc(fmtDateTime(R.signedAt))}</span></div></div>
      <div style="text-align:center;margin-top:20px"><h1 class="title2">Report Locked</h1><p class="l2">${R.accept.emailCopy ? `Customer asked for a copy at ${esc(R.accept.emailCopy)}.` : 'Saved on this iPad.'}</p></div>
      <div class="group" style="max-width:460px;margin:20px auto">

        <button class="cell ic-row" id="d-share">${sq('share', 'var(--green)')}<span style="flex:1">Share Client PDF</span>${chev}</button>

      <p class="sec-f" style="text-align:center">Emailing from your RainPhil mailbox arrives in a later update. Use Share → Mail or Outlook for now.</p>`;

async function finalizeReport() {
  if (!(await tryAssignNumber(R))) return false;
  R.signedAt = now();
  R.status = 'final';
  R.hash = await reportHash(R);
  audit(R, R.accept.mode === 'declined' ? 'Finalised – customer declined to sign' : 'Finalised and locked');
  await saveReport(R);
  return true;
}

/* ---- pdf.js ---- */
/* FSR PDF (A4, layout of the paper form SVC-FM-12(2)) built with jsPDF. kind: 'client' | 'internal'. */
const DOC_CONTROL = ['Company: RainPhil Inc.', 'Doc No. SVC-FM-12(2)', 'Eff. Date: 28 September 2022', 'Rev. No.: 2'];
const COMPANY_LINES = [
  '2/F Lot 2 Blk. 27 Arellano cor. Olivares Sts., Palanan, Makati City 1235, Philippines',
  'Tel: (632) 8844-9611 / (632) 8843-6352 · service@rainphil.com · www.rainphil.com',
  'Feedback: customercare@rainphil.com',
];
const PAGE = { w: 210, h: 297, m: 12, bottom: 268 };
const INK = [17, 17, 17], GRID = [85, 85, 85], LABEL_BG = [242, 243, 247], RED = [198, 40, 40];

// Standard PDF fonts only cover Latin-1/WinAnsi: map smart punctuation, drop the rest
const pdfText = s => String(s ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/₱/g, 'PHP ').replace(/→/g, '->')
  .replace(/[^\n\x20-\x7E -ÿ–—•€™]/g, '?');

function pdfFileName(r, kind) {
  const base = ['FSR', `${yearOf(r.signedAt || r.createdAt)}-${r.fsrNo || 'DRAFT'}`, r.customer.short || r.customer.name, r.instrument.serial, (r.problem || '').split('\n')[0].slice(0, 40)]
    .filter(Boolean).join(' ').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  return `${base}_${kind === 'internal' ? 'INTERNAL' : 'CLIENT'}.pdf`;
}

// window.__pdfPlain leaves text streams uncompressed so tests can search the output
const newPdfDoc = () => new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: !window.__pdfPlain });
async function buildPdf(r, kind) {
  const doc = newPdfDoc();
  await drawReport(doc, r, kind);
  doc.setProperties({ title: pdfFileName(r, kind).replace(/\.pdf$/, ''), subject: 'Field Service Report', author: 'RainPhil Inc.', creator: 'RainPhil FSR' });
  return doc.output('blob');
}
// Several reports in one PDF (for printing or archiving); each keeps its own page numbering
async function combinedPdf(list, kind, onEach) {
  const doc = newPdfDoc();
  for (const [i, r] of list.entries()) {
    if (i) doc.addPage();
    await drawReport(doc, r, kind);
    if (onEach && (await onEach(i)) === false) return null;
  }
  doc.setProperties({ title: `FSR reports (${list.length})`, subject: 'Field Service Reports', author: 'RainPhil Inc.', creator: 'RainPhil FSR' });
  return doc.output('blob');
}

/* QR verify code: the app address + FSR # + signing date + the first 16 hex of the fingerprint */
const verifyCode = hash => hash.slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
const appBase = () => location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '');
const verifyUrl = r => `${appBase()}#v=${r.fsrNo}.${new Date(r.signedAt).toLocaleDateString('en-CA', { timeZone: TZ }).replace(/-/g, '')}.${r.hash.slice(0, 16)}`;
function drawQr(doc, text, x, y, size) {
  const q = qrcode(0, 'L'); q.addData(text); q.make();
  const n = q.getModuleCount(), s = size / n;
  doc.setFillColor(0, 0, 0);
  for (let row = 0; row < n; row++) for (let col = 0; col < n; col++) if (q.isDark(row, col)) doc.rect(x + col * s, y + row * s, s + .02, s + .02, 'F');
}

async function drawReport(doc, r, kind) {
  const firstPage = doc.getNumberOfPages();
  const internal = kind === 'internal';
  const W = PAGE.w - PAGE.m * 2, X = PAGE.m;
  let y;
  const font = (size, style = 'normal', color = INK) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color); };
  const lh = size => size * 0.3528 * 1.25; // line height in mm for a font size in pt
  const split = (t, w) => doc.splitTextToSize(pdfText(t), w);

  const pageTop = first => {
    if (internal) {
      doc.setFillColor(...RED); doc.rect(0, 0, PAGE.w, 6, 'F');
      font(8, 'bold', [255, 255, 255]); doc.text('INTERNAL – CONFIDENTIAL · NOT FOR CUSTOMER', PAGE.w / 2, 4.1, { align: 'center' });
    }
    if (!first) {
      font(9, 'bold'); doc.text(pdfText(`Service Report # FSR-${r.fsrNo || 'DRAFT'} (continued)`), X, 13);
      doc.setDrawColor(31, 47, 224); doc.setLineWidth(.6); doc.line(X, 15, X + W, 15);
      y = 20; return;
    }
    doc.addImage(LOGO, 'JPEG', X, 9, 68, 68 * 257 / 1100);
    font(7.2, 'normal', [40, 40, 40]);
    COMPANY_LINES.forEach((l, i) => doc.text(pdfText(l), X, 29.5 + i * 3.3));
    font(10.5, 'bolditalic'); doc.text('Service Report # FSR-', X + W - 27, 16, { align: 'right' });
    font(21, 'bold', RED); doc.text(pdfText(r.fsrNo || '-----'), X + W, 16.6, { align: 'right' });
    font(8.5); doc.text(pdfText(`Date: ${fmtDate(r.signedAt || r.updatedAt)} · Rev ${r.rev || 0}`), X + W, 22, { align: 'right' });
    if (r.service.ref) doc.text(pdfText(`Customer ref: ${r.service.ref}`), X + W, 26, { align: 'right' });
    doc.setFillColor(31, 47, 224); doc.rect(X, 39, W, 1.1, 'F');
    doc.setFillColor(185, 189, 200); doc.rect(X, 40.1, W, .6, 'F');
    y = 44;
  };
  const newPage = () => { doc.addPage(); pageTop(false); };
  const ensure = h => { if (y + h > PAGE.bottom) newPage(); };

  // Bordered text box that continues across pages
  const box = (title, lines, opts = {}) => {
    const size = opts.size || 9, L = lh(size), pad = 2;
    font(size);
    const items = [];
    if (title) items.push({ t: title, bold: true });
    lines.forEach(l => items.push(l));
    ensure(L * 2 + pad * 2);
    let segTop = y; y += pad;
    for (const it of items) {
      const indent = it.indent || 0;
      font(size, it.bold ? 'bold' : 'normal', it.color || INK);
      const wrapped = split(it.t, W - pad * 2 - indent - (it.num ? 5 : 0));
      wrapped.forEach((ln, i) => {
        if (y + L > PAGE.bottom - pad) {
          doc.setDrawColor(...(opts.border || GRID)); doc.setLineWidth(.25); doc.rect(X, segTop, W, y + pad - segTop);
          newPage(); segTop = y; y += pad;
        }
        if (it.num && i === 0) doc.text(it.num, X + pad + indent, y + L * .75);
        doc.text(ln, X + pad + indent + (it.num ? 5 : 0), y + L * .75);
        y += L;
      });
    }
    y += pad;
    doc.setDrawColor(...(opts.border || GRID)); doc.setLineWidth(opts.border ? .45 : .25);
    if (opts.dash) doc.setLineDashPattern([1.2, 1], 0);
    doc.rect(X, segTop, W, y - segTop);
    doc.setLineDashPattern([], 0);
    y += 2.5;
  };

  // Table with wrapped cells. cols: [{w, label?, bg?, align?}], rows: [[text...]]
  const table = (cols, rows, head) => {
    const size = 8.6, L = lh(size), pad = 1.6;
    const drawRow = (cells, isHead) => {
      const wrapped = cells.map((c, i) => split(c, cols[i].w - pad * 2));
      const h = Math.max(...wrapped.map(w => w.length)) * L + pad * 2;
      ensure(h);
      let x = X;
      cells.forEach((_, i) => {
        const col = cols[i], bg = isHead ? [238, 240, 245] : col.bg;
        if (bg) { doc.setFillColor(...bg); doc.rect(x, y, col.w, h, 'F'); }
        doc.setDrawColor(...GRID); doc.setLineWidth(.25); doc.rect(x, y, col.w, h);
        font(size, isHead || col.bold ? 'bold' : 'normal');
        wrapped[i].forEach((ln, j) => doc.text(ln, col.align === 'center' ? x + col.w / 2 : x + pad, y + pad + L * (j + .75), { align: col.align === 'center' ? 'center' : 'left' }));
        x += col.w;
      });
      y += h;
    };
    if (head) drawRow(head, true);
    rows.forEach(rw => drawRow(rw));
    y += 2.5;
  };

  /* ----- page 1 ----- */
  pageTop(true);
  const inst = r.instrument;
  const lab = { w: 24, bg: LABEL_BG, bold: true };
  table([lab, { w: 69 }, { ...lab, w: 28 }, { w: W - 24 - 69 - 28 }], [
    ['Customer', r.customer.name, 'Instrument Type', inst.type],
    ['Address', r.customer.address, 'Brand', inst.brand],
    ['Contact', [r.contact.name, r.contact.designation].filter(Boolean).join(' – '), 'Model', inst.model],
    ['Phone', r.contact.phone, 'Serial #', inst.serial + (inst.system ? ` (${inst.system})` : '')],
    ['E-mail', r.contact.email, r.modules.length ? 'Modules' : 'Software', r.modules.length ? r.modules.map(m => [m.name, m.serial].filter(Boolean).join(' ')).join(' · ') : inst.software],
  ]);

  // Type of service with the chosen option circled, as on the paper form
  ensure(9);
  doc.setDrawColor(...GRID); doc.setLineWidth(.25); doc.rect(X, y, W, 8);
  font(9, 'bold'); doc.text('Type of Service:', X + 2, y + 5.3);
  let tx = X + 31;
  const opts = SERVICE_TYPES.filter(t => t !== 'Other' || r.service.type === 'Other');
  opts.forEach(t => {
    font(8.6, t === r.service.type ? 'bold' : 'normal');
    const tw = doc.getTextWidth(t);
    doc.text(t, tx, y + 5.3);
    if (t === r.service.type) { doc.setLineWidth(.4); doc.setDrawColor(...INK); doc.ellipse(tx + tw / 2, y + 4.3, tw / 2 + 2.2, 3); }
    tx += tw + 6.5;
  });
  if (r.service.nature) { font(8.6, 'normal', [90, 90, 90]); doc.text(pdfText(`Work: ${r.service.nature}`), X + W - 2, y + 5.3, { align: 'right' }); }
  y += 10.5;

  boxInline({ t: 'Problem / Request:', rest: r.problem });

  // One bordered row: bold label followed by wrapped text
  function boxInline(it) {
    const size = 9, L = lh(size), pad = 2;
    font(size, 'bold'); const tw = doc.getTextWidth(pdfText(it.t)) + 1.5;
    const rest = split(it.rest || '', W - pad * 2 - tw);
    const h = Math.max(1, rest.length) * L + pad * 2;
    ensure(h);
    doc.text(pdfText(it.t), X + pad, y + pad + L * .75);
    font(size); rest.forEach((ln, i) => doc.text(ln, X + pad + tw, y + pad + L * (i + .75)));
    doc.setDrawColor(...GRID); doc.setLineWidth(.25); doc.rect(X, y, W, h);
    y += h + 2.5;
  }

  const findingLines = [];
  r.findings.filter(f => f.text.trim() || f.lines.length).forEach((f, i) => {
    findingLines.push({ t: f.text, num: `${i + 1}.` });
    f.lines.filter(l => l.mod || l.text).forEach(l => findingLines.push({ t: `${l.mod}${l.mod && l.text ? ' – ' : ''}${l.text}`, indent: 5 }));
  });
  box('Findings:', findingLines.length ? findingLines : [{ t: '—' }]);

  const parts = r.parts.filter(p => p.desc || p.partNo);
  table([{ w: 9, align: 'center' }, { w: W - 9 - 40 - 14 }, { w: 40 }, { w: 14, align: 'center' }],
    parts.length ? parts.map((p, i) => [String(i + 1), p.desc, p.partNo || '', String(p.qty ?? '')]) : [['', 'No parts used', '', '']],
    ['#', 'Materials / Parts Used', 'Part No.', 'Qty']);

  boxInline({ t: 'Status after visit:', rest: r.outcome || '—' });
  if (r.recommendation || r.nextVisit) boxInline({ t: 'Recommendation:', rest: [r.recommendation, r.nextVisit && `Next visit: ${fmtDate(r.nextVisit + 'T00:00:00')}`].filter(Boolean).join('\n') });
  if (r.service.continuation) boxInline({ t: 'Continuation of:', rest: `FSR # ${r.service.continuation}` });

  if (internal) {
    const I = r.internal;
    const lines = [
      ['Root cause / assessment', I.rootCause], ['Follow-up for the office', I.followUp], ['Warranty / billing', I.billing], ['Relationship notes', I.relationship],
    ].filter(x => x[1]).map(x => ({ t: `${x[0]}: ${x[1]}` }));
    if (r.hash) lines.push({ t: `Content fingerprint (SHA-256): ${r.hash}`, color: [100, 100, 100] });
    lines.push({ t: 'Audit trail:', bold: true });
    r.audit.forEach(a => lines.push({ t: `${fmtDateTime(a.t)} – ${a.e}`, color: [100, 100, 100] }));
    if (r.accept.emailCopy) lines.push({ t: `Customer requested a copy at: ${r.accept.emailCopy}`, color: [100, 100, 100] });
    box('INTERNAL NOTES', lines, { border: [168, 90, 0], dash: true, size: 8.4 });
  }

  /* ----- signatures ----- */
  ensure(52);
  y += 2;
  const colW = (W - 10) / 2, rx = X + colW + 10;
  font(9.5, 'bold'); doc.text('Serviced and Reported by', X, y); doc.text('Accepted by', rx, y);
  const lineY = y + 19;
  const engs = r.engineers.filter(e => e.name);
  const slot = colW / Math.max(1, engs.length);
  engs.forEach((e, i) => { if (e.sig) addSig(e.sig, X + i * slot, lineY, slot - 2); });
  doc.setDrawColor(...INK); doc.setLineWidth(.3); doc.line(X, lineY, X + colW, lineY); doc.line(rx, lineY, rx + colW, lineY);
  const a = r.accept;
  if (a.sig) addSig(a.sig, rx, lineY, colW);
  else if (a.mode === 'declined' || a.mode === 'pending' || r.status === 'draft') {
    font(8.5, 'italic', [120, 120, 120]);
    doc.text(a.mode === 'declined' ? 'Customer declined to sign' : a.mode === 'pending' ? 'Awaiting customer signature' : 'Not yet signed', rx + 2, lineY - 3);
  }
  font(8.4);
  const engNames = split(engs.map(e => e.name).join(' / ') + ' – ' + (engs[0]?.designation || 'Service Engineer') + (engs.length > 1 ? 's' : ''), colW);
  doc.text(engNames, X, lineY + 4);
  let ly = lineY + 4 + engNames.length * lh(8.4);
  const lead = engs[0] || {};
  doc.text(pdfText(`Date: ${visitDates(r.service)} · Time: ${fmtClock(lead.start)} – ${fmtClock(lead.end)}`), X, ly);

  const accLines = [];
  if (a.name) accLines.push([a.name, a.designation].filter(Boolean).join(' – ') + (a.license ? ` · Lic. No. ${a.license}` : ''));
  if (a.mode === 'behalf') accLines.push(`FOR: ${a.forWhom}${a.reason ? ` (${a.reason})` : ''}`);
  if (a.mode === 'declined') accLines.push(`Reason: ${a.reason}`);
  if (a.signedAt) accLines.push(fmtDateTime(a.signedAt));
  let ay = lineY + 4;
  accLines.forEach(l => { split(l, colW).forEach(ln => { doc.text(ln, rx, ay); ay += lh(8.4); }); });
  if (a.sig) { font(7.2, 'normal', [90, 90, 90]); split(settingsOf(App.user).statement, colW).forEach(ln => { doc.text(ln, rx, ay); ay += lh(7.2); }); }
  y = Math.max(ly, ay) + 4;

  function addSig(dataUrl, x, baseY, maxW) {
    try {
      const p = doc.getImageProperties(dataUrl);
      let h = 15, w = p.width / p.height * h;
      if (w > maxW) { w = maxW; h = p.height / p.width * w; }
      doc.addImage(dataUrl, 'PNG', x, baseY - h - .5, w, h);
    } catch { }
  }

  /* ----- photos (internal PDF only) ----- */
  if (internal && r.photos.length) {
    newPage();
    font(11, 'bold'); doc.text('Photos', X, y); y += 5;
    const colWp = (W - 6) / 2;
    let col = 0;
    for (const p of r.photos) {
      const rec = await DB.get('photos', p.id); if (!rec) continue;
      const url = await blobToDataURL(rec.blob);
      const pr = doc.getImageProperties(url);
      const h = Math.min(colWp * pr.height / pr.width, 95), w = h * pr.width / pr.height;
      if (col === 0) ensure(h + 8);
      const x = X + col * (colWp + 6);
      doc.addImage(url, 'JPEG', x, y, w, h);
      font(8, 'normal', [70, 70, 70]); doc.text(split(p.caption || '', colWp)[0] || '', x, y + h + 4);
      if (col === 1) y += h + 9;
      col = 1 - col;
    }
  }

  const lastPage = doc.getNumberOfPages(), pages = lastPage - firstPage + 1;

    font(7, 'normal', [85, 85, 85]);
    DOC_CONTROL.forEach((l, j) => doc.text(l, X + W, 280 + j * 3, { align: 'right' }));
    const qr = r.hash && r.fsrNo && i === firstPage, tx0 = qr ? X + 23 : X;
    if (qr) drawQr(doc, verifyUrl(r), X, 270.5, 20);

    doc.text(`Page ${i - firstPage + 1} of ${pages}`, tx0, 286);
  }
  function watermark(text, color) {
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({ opacity: .07 }));

    doc.text(text, PAGE.w / 2, PAGE.h / 2 + 20, { align: 'center', angle: 35 });

  }

}

/* ---------- backup / restore: JSON encrypted with a password (AES-GCM, key from PBKDF2-SHA256) ---------- */
const BACKUP_ITER = 310000;
async function backupKey(password, salt, iter, usage) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, usage);
}
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode(...b.subarray(i, i + 32768)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function encryptBackup(data, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await backupKey(password, salt, BACKUP_ITER, ['encrypt']), new TextEncoder().encode(JSON.stringify(data)));
  return { app: 'rainphil-fsr', encrypted: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: BACKUP_ITER, salt: b64(salt), iv: b64(iv), profile: data.profile, exportedAt: data.exportedAt, data: b64(ct) };
}
async function decryptBackup(file, password) {
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(file.iv) }, await backupKey(password, unb64(file.salt), file.iter, ['decrypt']), unb64(file.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('That password is not correct.'); }
}

/* ---- export.js ---- */
/* Export: CSV for trackers (saved column presets, one row per report or per part) and batch PDFs as a ZIP or one combined PDF. */

/* ---------- ZIP (stored, not compressed – PDFs are compressed already) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(files) {
  const out = [], central = [];
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const rec = (size, fill) => { const b = new Uint8Array(size), v = new DataView(b.buffer); fill(v); return b; };
  let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = new TextEncoder().encode(f.name), crc = crc32(data);
    const common = v => { v.setUint16(6, 0x0800, true); v.setUint16(10, time, true); v.setUint16(12, date, true); v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true); v.setUint16(26, name.length, true); };
    // local header: version, UTF-8 names flag, method 0 (stored), time, date, crc, sizes, name length
    const local = rec(30, v => { v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); common(v); });
    out.push(local, name, data);
    central.push(rec(46, v => { v.setUint32(0, 0x02014b50, true); v.setUint16(4, 20, true); v.setUint16(6, 20, true); v.setUint16(8, 0x0800, true); v.setUint16(12, time, true); v.setUint16(14, date, true); v.setUint32(16, crc, true); v.setUint32(20, data.length, true); v.setUint32(24, data.length, true); v.setUint16(28, name.length, true); v.setUint32(42, offset, true); }), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, b) => s + b.length, 0);
  const end = rec(22, v => { v.setUint32(0, 0x06054b50, true); v.setUint16(8, files.length, true); v.setUint16(10, files.length, true); v.setUint32(12, cdSize, true); v.setUint32(16, offset, true); });
  return new Blob([...out, ...central, end], { type: 'application/zip' });
}

const BUILTIN_PRESETS = [
  { name: 'Standard', mode: 'report', cols: ['fsrNo', 'status', 'from', 'signed', 'customer', 'model', 'serial', 'svcType', 'nature', 'problem', 'outcome', 'engineers', 'parts'] },
  { name: 'Parts usage', mode: 'part', cols: ['fsrNo', 'from', 'customer', 'model', 'serial', 'partLine', 'partDesc', 'partNo', 'partQty', 'engineers'] },
];
function csvTable(list, cols, mode) {
  const defs = cols.map(k => CSV_COLS.find(c => c.k === k)).filter(Boolean);
  const rows = [];
  for (const r of list) {
    if (mode === 'part') { const ps = usedParts(r); (ps.length ? ps : [null]).forEach((p, i) => rows.push(defs.map(c => c.f(r, p, i)))); }
    else rows.push(defs.map(c => c.f(r, null, 0)));
  }
  return { head: defs.map(c => c.l), rows };
}
// Quote when needed; a leading = + @ would make Excel run the cell as a formula
const csvCell = v => { let s = String(v ?? ''); if (/^[=+@\t\r]|^-(?=[A-Za-z(])/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = t => '﻿' + [t.head, ...t.rows].map(row => row.map(csvCell).join(',')).join('\r\n') + '\r\n';

/* ---------- export screen ---------- */
const EX = { ids: null, from: '', to: '', statuses: ['final', 'sent'], customer: '', preset: 'Standard', mode: 'report', cols: [...BUILTIN_PRESETS[0].cols] };
const userPresets = () => settingsOf(App.user).csvPresets || [];
async function exportList() {
  const all = await myReports();
  const list = EX.ids ? all.filter(r => EX.ids.includes(r.id))
    : all.filter(r => EX.statuses.includes(r.status) && (!EX.customer || r.customer.name === EX.customer)
      && (!EX.from || (r.service.from || '') >= EX.from) && (!EX.to || (r.service.from || '') <= EX.to));
  return list.sort((a, b) => (+a.fsrNo || Infinity) - (+b.fsrNo || Infinity) || (a.createdAt || '').localeCompare(b.createdAt || ''));
}

  <div class="gsec"><div class="sec-h">Table (CSV for Excel or a tracker)</div><div class="group">
    <div class="cell tap" id="ex-preset">${sq('table', 'var(--green)')}<span style="flex:1">Preset</span><span class="l2" id="ex-pname"></span>${chev}</div>
    <div class="cell"><span style="flex:1">Rows</span><div class="segmented" id="ex-mode"><button data-m="report" class="${EX.mode === 'report' ? 'on' : ''}">One per Report</button><button data-m="part" class="${EX.mode === 'part' ? 'on' : ''}">One per Part</button></div></div></div>
    <div class="sec-h" style="margin-top:18px">Preview<span class="spacer"></span><button class="btn filled capsule" id="ex-csv">${ic('download', 'sm')}Download CSV</button></div>

  <div class="gsec"><div class="sec-h">Columns<span class="spacer"></span><span class="l2" id="ex-ncols" style="text-transform:none"></span></div>
    <div class="group" id="ex-cols">${CSV_COLS.map(c => `<div class="cell tap ${EX.cols.includes(c.k) ? 'on' : ''}" data-col="${c.k}"><span style="flex:1">${esc(c.l)}${c.int ? ' <span style="color:var(--orange);font-size:13px">· internal</span>' : ''}</span><span class="checkmark">${ic('check', 'sm')}</span></div>`).join('')}</div>
    <div class="sec-f">Column order follows this list. Dates are written as YYYY-MM-DD so Excel sorts them correctly.</div></div>`;

AFTER.export = async () => {

  const refresh = async () => {
    list = await exportList();
    $('#ex-count').textContent = `${list.length} report${list.length === 1 ? '' : 's'}${EX.ids ? '' : ' match'}`;
    $('#ex-pname').textContent = EX.preset || 'Custom';
    $('#ex-ncols').textContent = `${EX.cols.length} chosen`;
    const cols = CSV_COLS.filter(c => EX.cols.includes(c.k)).map(c => c.k);
    const t = csvTable(list.slice(0, 6), cols, EX.mode);
    $('#ex-prev').innerHTML = t.head.length ? `<table><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${t.rows.slice(0, 6).map(row => `<tr>${row.map(v => `<td>${esc(String(v).slice(0, 80))}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="empty" style="padding:20px">Choose at least one column.</div>';
  };

  else {
    $('#ex-from').onchange = e => setFilter('from', e.target.value);

    $$('#ex-st button').forEach(b => b.onclick = () => { b.classList.toggle('on'); EX.statuses = $$('#ex-st button.on').map(x => x.dataset.s); refresh(); });
  }
  $$('#ex-mode button').forEach(b => b.addEventListener('click', () => {
    EX.mode = b.dataset.m; EX.preset = '';

    if (EX.mode === 'part' && !EX.cols.some(k => k.startsWith('part') && k !== 'parts')) { EX.cols = CSV_COLS.map(c => c.k).filter(k => EX.cols.includes(k) && k !== 'parts' || ['partLine', 'partDesc', 'partNo', 'partQty'].includes(k)); return go('export', null, true); }

  $('#ex-zi').onclick = () => need() && batchPdfs(list, ['internal']);

};
function presetMenu(btn) {
  const u = App.user, mine = userPresets();
  const apply = p => { EX.preset = p.name; EX.mode = p.mode; EX.cols = [...p.cols]; go('export', null, true); };
  const items = [...BUILTIN_PRESETS, ...mine].map(p => ({ label: p.name, on: EX.preset === p.name, fn: () => apply(p) }));
  items.push({ label: 'Save Current as Preset…', icon: 'plus', fn: () => alertBox('Save Preset', 'Name this set of columns, e.g. "NBS tracker".', [{ label: 'Cancel' }, {
    label: 'Save', needsText: true, fn: async name => {
      name = name.trim();
      if (BUILTIN_PRESETS.some(p => p.name === name)) return banner('That name is a built-in preset – choose another', 'x', null, 'var(--orange)');
      u.settings = { ...(u.settings || {}), csvPresets: [...mine.filter(p => p.name !== name), { name, mode: EX.mode, cols: [...EX.cols] }] };
      await DB.put('profiles', u); EX.preset = name; go('export', null, true); banner(`Preset “${name}” saved`, 'table');
    },
  }], { placeholder: 'Preset name' }) });
  if (mine.some(p => p.name === EX.preset)) items.push({ label: `Delete “${EX.preset}”`, icon: 'trash', destr: true, fn: async () => { u.settings = { ...u.settings, csvPresets: mine.filter(p => p.name !== EX.preset) }; await DB.put('profiles', u); EX.preset = ''; go('export', null, true); } });
  menu(btn, items);
}

/* ---------- batch PDFs: made one at a time (keeps iPad memory low), then shared in a fresh tap ---------- */
async function batchPdfs(list, kinds, combined) {
  let cancelled = false, finished = false;
  const total = combined ? list.length : list.length * kinds.length;
  const host = sheet('Creating PDFs', `<button class="btn plain" onclick="closeSheet()">Cancel</button>`, '',
    `<div style="padding:28px 20px"><div class="prog" style="height:6px"><i id="bprog" style="width:0;transition:width .3s"></i></div><p class="l2" id="bmsg" style="text-align:center;margin-top:14px">Starting…</p></div>`,
    () => { if (!finished) cancelled = true; });
  const step = async (n, label) => {
    $('#bprog', host).style.width = `${Math.round(n / total * 100)}%`;
    $('#bmsg', host).textContent = label;
    await new Promise(r => setTimeout(r, 30)); // let the progress paint between PDFs
    return !cancelled;
  };
  const kindName = kinds.length > 1 ? 'CLIENT+INTERNAL' : kinds[0].toUpperCase();
  const nums = list.map(r => +r.fsrNo).filter(Boolean);
  const span = nums.length ? (Math.min(...nums) === Math.max(...nums) ? `${nums[0]}` : `${Math.min(...nums)}-${Math.max(...nums)}`) : `${list.length} drafts`;
  try {
    let blob, name;
    if (combined) {
      blob = await combinedPdf(list, kinds[0], i => step(i + 1, `Added ${i + 1} of ${total}`));
      name = `FSR_${span}_${kindName}_combined.pdf`;
    } else {
      const files = [], seen = new Set();
      let n = 0;
      for (const r of list) for (const k of kinds) {
        if (!(await step(n, `Creating ${n + 1} of ${total} · ${r.fsrNo ? 'FSR # ' + r.fsrNo : 'Draft'}`))) break;
        let fname = pdfFileName(r, k), i = 2;
        while (seen.has(fname)) fname = pdfFileName(r, k).replace(/\.pdf$/, ` (${i++}).pdf`);
        seen.add(fname);
        files.push({ name: fname, blob: await buildPdf(r, k) });
        n++;
      }
      if (!cancelled) { await step(total, 'Packing the ZIP…'); blob = await makeZip(files); }
      name = `FSR_${span}_${kindName}.zip`;
    }
    if (cancelled || !blob) return;
    finished = true;
    readyToShare(blob, name, combined ? 'PDF Ready' : 'ZIP Ready');
  } catch (e) {
    finished = true; closeSheet();
    console.error(e); banner('Could not create the PDFs: ' + e.message, 'x', null, 'var(--red)');
  }
}
// iPad only opens the share sheet straight after a tap, so long jobs end with their own Share button
function readyToShare(blob, name, title) {
  const host = sheet(title, `<button class="btn plain" onclick="closeSheet()">Close</button>`, '',
    `<div style="padding:24px 16px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px">${sq('check', 'var(--green)', 'width:56px;height:56px;border-radius:16px')}</div>
    <b class="headline" id="rsn" style="word-break:break-word"></b><p class="l2" style="margin:4px 0 20px">${(blob.size / 1048576).toFixed(1)} MB</p>
    <button class="btn filled capsule" id="rss" style="min-width:200px">${ic('share', 'sm')}Share or Save</button></div>`);
  $('#rsn', host).textContent = name;
  $('#rss', host).onclick = () => shareOrDownload(blob, name);
}

/* ---- app.js ---- */
/* Boot: open storage, register the offline service worker, show the lock screen. */
async function boot() {
  try { await openDB(); } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font:17px -apple-system,sans-serif">This browser blocked offline storage (private browsing?). RainPhil FSR needs it to save reports.<br><br><small>${esc(e.message)}</small></div>`;
    return;
  }
  requestPersistence();
  syncOnline();
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href)) {
    // The prompt stays until tapped: an iPad home-screen app is rarely closed, so a waiting update would otherwise never install
    const offer = w => { if (!$('#updbanner')) banner('A new version is ready', 'refresh', { label: 'Update', fn: async () => { await flushSave(); w.postMessage('skipWaiting'); } }, null, true).id = 'updbanner'; };
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
    }).catch(() => { });
    // Reload only for an update the engineer accepted – not when the very first install takes control
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => hadController && location.reload());
  }
  const v = readVerify();
  if (v) showVerify(v);
  const act = readActivation();
  if (act && !(await DB.all('profiles')).some(p => FSK.norm(p.username) === FSK.norm(act.user))) return onboarding(0, act);
  App.pendingActivation = act;
  showLock();
}
// A link opened while the app is already running (e.g. tapped in Mail with the app open)
addEventListener('hashchange', () => { const v = readVerify(); if (v) return showVerify(v); const act = readActivation(); if (act) App.user ? handleActivation(act) : (App.pendingActivation = act); });
boot();
